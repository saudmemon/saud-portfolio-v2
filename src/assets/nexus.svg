<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nexus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e0a" />
      <stop offset="50%" stop-color="#271810" />
      <stop offset="100%" stop-color="#3c2013" />
    </linearGradient>
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-orange-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#nexus-grad)" />
  
  <!-- Glow under notepad -->
  <circle cx="400" cy="225" r="130" fill="url(#glow-orange)" filter="url(#glow-orange-filter)" />
  
  <!-- Subtle writing line details in background -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1.5">
    <line x1="100" y1="80" x2="700" y2="80" />
    <line x1="100" y1="140" x2="700" y2="140" />
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="260" x2="700" y2="260" />
    <line x1="100" y1="320" x2="700" y2="320" />
    <line x1="100" y1="380" x2="700" y2="380" />
  </g>

  <!-- Centered blogging notepad representation -->
  <g transform="translate(400, 220)">
    <!-- Main Card/Page -->
    <rect x="-90" y="-110" width="180" height="220" rx="8" fill="#1e1b18" stroke="#f97316" stroke-width="2" stroke-opacity="0.6" />
    <rect x="-80" y="-100" width="160" height="200" rx="4" fill="#12100e" />
    
    <!-- Notepad Lines inside card -->
    <line x1="-60" y1="-70" x2="20" y2="-70" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" />
    <line x1="-60" y1="-45" x2="60" y2="-45" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="-25" x2="40" y2="-25" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="-5" x2="50" y2="-5" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" />
    
    <!-- Image/Thumbnail placeholder block inside card -->
    <rect x="-60" y="20" width="120" height="50" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
    <!-- Small star or sparkle in thumbnail block -->
    <path d="M 0,40 Q 0,45 5,45 Q 0,45 0,50 Q 0,45 -5,45 Q 0,45 0,40 Z" fill="#f97316" opacity="0.6" transform="translate(-30, 5)" />

    <!-- Pen / Feather Quill Drawing overlay -->
    <g transform="translate(70, -70) rotate(45)">
      <!-- Quill Nib -->
      <path d="M 0,0 L -8,-25 L 8,-25 Z" fill="#f97316" />
      <line x1="0" y1="0" x2="0" y2="-25" stroke="#12100e" stroke-width="1.5" />
      <!-- Feather main body -->
      <path d="M -12,-25 Q -25,-100 0,-140 Q 25,-100 12,-25 Z" fill="#ffffff" fill-opacity="0.8" />
      <line x1="0" y1="-25" x2="0" y2="-130" stroke="#f97316" stroke-width="2" />
    </g>
  </g>
</svg>
