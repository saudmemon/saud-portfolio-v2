<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="task-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b061e" />
      <stop offset="50%" stop-color="#140a2b" />
      <stop offset="100%" stop-color="#2d0a3d" />
    </linearGradient>
    <linearGradient id="glow-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow-pk-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#task-grad)" />
  
  <!-- Glow background -->
  <circle cx="400" cy="225" r="140" fill="url(#glow-pink)" filter="url(#glow-pk-filter)" />
  
  <!-- Abstract lines indicating columns -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
  </g>

  <!-- Centered Kanban Board / Task representation -->
  <g transform="translate(400, 220)">
    <!-- Column 1 (To Do) -->
    <g transform="translate(-160, -90)">
      <rect x="0" y="0" width="100" height="180" rx="6" fill="#180e29" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">TO DO</text>
      <!-- Task Card 1 -->
      <rect x="8" y="32" width="84" height="40" rx="4" fill="#25123e" stroke="#6366f1" stroke-opacity="0.2" />
      <line x1="16" y1="46" x2="66" y2="46" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="56" x2="46" y2="56" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2.5" stroke-linecap="round" />
    </g>
    
    <!-- Column 2 (In Progress) -->
    <g transform="translate(-40, -90)">
      <rect x="0" y="0" width="100" height="180" rx="6" fill="#180e29" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">DOING</text>
      <!-- Task Card 2 -->
      <rect x="8" y="32" width="84" height="50" rx="4" fill="#25123e" stroke="#d946ef" stroke-opacity="0.4" />
      <line x1="16" y1="46" x2="76" y2="46" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="56" x2="56" y2="56" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round" />
      <!-- Glowing dot indicating progress -->
      <circle cx="76" cy="66" r="3" fill="#d946ef" />
    </g>

    <!-- Column 3 (Done) -->
    <g transform="translate(80, -90)">
      <rect x="0" y="0" width="100" height="180" rx="6" fill="#180e29" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">DONE</text>
      <!-- Task Card 3 -->
      <rect x="8" y="32" width="84" height="40" rx="4" fill="#122223" stroke="#10b981" stroke-opacity="0.4" />
      <!-- Checkmark -->
      <path d="M 66,48 L 70,52 L 78,44" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="48" x2="54" y2="48" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
