<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="iot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#0f1026" />
      <stop offset="100%" stop-color="#210f35" />
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#iot-grad)" />
  
  <!-- Glow behind gateway -->
  <circle cx="400" cy="225" r="140" fill="url(#glow-purple)" filter="url(#glow-filter)" />
  
  <!-- Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400" />
    <path d="M 150,0 L 150,450 M 300,0 L 300,450 M 450,0 L 450,450 M 600,0 L 600,450" />
  </g>
  
  <!-- Network Nodes and Connections -->
  <g stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 400,225 L 260,140 M 400,225 L 540,140 M 400,225 L 240,300 M 400,225 L 560,290 M 400,225 L 400,90 M 400,225 L 400,360" />
    <!-- Nodes -->
    <circle cx="260" cy="140" r="6" fill="#a855f7" />
    <circle cx="540" cy="140" r="6" fill="#ec4899" />
    <circle cx="240" cy="300" r="8" fill="#3b82f6" />
    <circle cx="560" cy="290" r="5" fill="#a855f7" />
    <circle cx="400" cy="90" r="7" fill="#10b981" />
    <circle cx="400" cy="360" r="6" fill="#3b82f6" />
  </g>

  <!-- Central Gateway Hub & Shield -->
  <g transform="translate(400, 225)">
    <!-- Outer Shield/Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="45" fill="#0f172a" stroke="#ec4899" stroke-width="3" />
    
    <!-- Shield Icon inside -->
    <path d="M -12,-15 L 12,-15 L 12,-3 C 12,7 0,16 0,16 C 0,16 -12,7 -12,-3 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Checkmark inside shield -->
    <path d="M -5,0 L -1,4 L 6,-3" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Live Pulse Circles -->
  <circle cx="400" cy="225" r="75" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="400" cy="225" r="105" fill="none" stroke="#ec4899" stroke-opacity="0.1" stroke-width="1" />
</svg>
