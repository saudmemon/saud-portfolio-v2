<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="myai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#myai-grad)" />
  
  <!-- Glowing background circle -->
  <circle cx="400" cy="225" r="150" fill="url(#glow-grad)" filter="url(#glow)" />
  
  <!-- Grid Lines -->
  <path d="M 0,225 L 800,225 M 400,0 L 400,450" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <circle cx="400" cy="225" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <circle cx="400" cy="225" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- AI Sparks/Stars -->
  <g transform="translate(400, 225) scale(2.5)">
    <!-- Main Sparkle -->
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#10b981" />
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#ffffff" opacity="0.9" />
  </g>
  
  <!-- Decorative small sparkles -->
  <path d="M 250,120 Q 250,135 265,135 Q 250,135 250,150 Q 250,135 235,135 Q 250,135 250,120 Z" fill="#6366f1" opacity="0.6" />
  <path d="M 550,300 Q 550,315 565,315 Q 550,315 550,330 Q 550,315 535,315 Q 550,315 550,300 Z" fill="#10b981" opacity="0.6" />

  <!-- Text Interface Representation -->
  <rect x="250" y="320" width="300" height="40" rx="20" fill="#0c0a09" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="280" y="344" fill="#ffffff" fill-opacity="0.7" font-family="system-ui, sans-serif" font-size="12" letter-spacing="1">How can I help you today?</text>
  <path d="M 515,333 L 525,340 L 515,347 Z" fill="#10b981" />
</svg>
