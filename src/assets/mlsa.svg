<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mlsa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021510" />
      <stop offset="50%" stop-color="#072023" />
      <stop offset="100%" stop-color="#09352e" />
    </linearGradient>
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow-ef" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#mlsa-grad)" />
  
  <!-- Background Light Glow -->
  <circle cx="400" cy="225" r="150" fill="url(#glow-teal)" filter="url(#glow-ef)" />

  <!-- Abstract Tech Grid Lines -->
  <path d="M 0,225 C 200,100 600,350 800,225" fill="none" stroke="#0ea5e9" stroke-opacity="0.1" stroke-width="2" />
  <path d="M 0,275 C 200,150 600,400 800,275" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- Globe Representation in center -->
  <circle cx="400" cy="225" r="95" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
  <ellipse cx="400" cy="225" rx="95" ry="35" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
  <ellipse cx="400" cy="225" rx="35" ry="95" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
  
  <!-- Microsoft student ambassadors themed logo/icon in center -->
  <g transform="translate(400, 225) scale(1.3)">
    <!-- Microsoft Logo in light outline form -->
    <!-- Top Left -->
    <rect x="-30" y="-30" width="26" height="26" fill="#f25022" fill-opacity="0.8" rx="2" />
    <!-- Top Right -->
    <rect x="4" y="-30" width="26" height="26" fill="#7fba00" fill-opacity="0.8" rx="2" />
    <!-- Bottom Left -->
    <rect x="-30" y="4" width="26" height="26" fill="#00a4ef" fill-opacity="0.8" rx="2" />
    <!-- Bottom Right -->
    <rect x="4" y="4" width="26" height="26" fill="#ffb900" fill-opacity="0.8" rx="2" />
    
    <!-- Student Mortarboard/Graduation Cap overlaying on top -->
    <path d="M -40,-35 L 0,-50 L 40,-35 L 0,-20 Z" fill="#ffffff" />
    <path d="M -25,-29 L -25,-10 C -25,-5 25,-5 25,-10 L 25,-29" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <path d="M 30,-31 L 30,-15 C 30,-10 32,-10 32,-15" fill="none" stroke="#ffb900" stroke-width="2" />
    <circle cx="32" cy="-10" r="3" fill="#ffb900" />
  </g>

  <!-- Community Ring nodes representing ambassadors -->
  <g fill="#ffffff">
    <circle cx="280" cy="160" r="5" opacity="0.6" />
    <circle cx="520" cy="160" r="5" opacity="0.6" />
    <circle cx="300" cy="300" r="6" fill="#0ea5e9" />
    <circle cx="500" cy="300" r="6" fill="#10b981" />
  </g>
</svg>
